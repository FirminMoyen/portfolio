# Configuration minimale — à adapter au fur et à mesure des besoins.

# URL de base du site en production.
baseURL = "https://firminmoyen.dev/"

defaultContentLanguage = "fr"

# Titre affiché dans l'en-tête et les balises <title>.
title = "Homelab & Infrastructure"

# Thème PaperMod, installé en submodule dans themes/PaperMod.
theme = ["PaperMod"]

# Génère les brouillons dans `hugo server -D` mais pas dans un `hugo` classique.
buildDrafts = false

# Langue du contenu et locale utilisée pour le formatage (dates, etc.).
[languages.fr]
  label = "Français"
  weight = 1
  locale = "fr-FR"

# Menu principal, affiché par le partial header de PaperMod via site.Menus.main.
[[menu.main]]
  name = "Accueil"
  url = "/"
  weight = 5

[[menu.main]]
  name = "Journal"
  url = "/journal/"
  weight = 10

[[menu.main]]
  name = "Projets"
  url = "/projects/"
  weight = 20

[[menu.main]]
  name = "À propos"
  url = "/about/"
  weight = 30

# Dark mode par défaut (bouton de bascule PaperMod toujours disponible).
[params]
  defaultTheme = "dark"
  ShowReadingTime = true

# Pagination des listes (journal, projects) via PaperMod.
[pagination]
  pagerSize = 10
