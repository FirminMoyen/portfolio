# Configuration minimale — à adapter au fur et à mesure des besoins.

# URL de base du site en production.
baseURL = "https://firminmoyen.dev/"

# Les deux langues vivent en sous-dossier (/fr/, /en/) ; la racine redirige vers
# la langue par défaut (décision D1, docs/architecture.md §17). Changer de langue
# par défaut ne casse donc aucun lien.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

# Dates de publication interprétées dans ce fuseau.
timeZone = "Europe/Brussels"

# Génère /robots.txt.
enableRobotsTXT = true

# Un ref/relref cassé fait échouer le build.
refLinksErrorLevel = "ERROR"

# Titre affiché dans l'en-tête et les balises <title> : le nom d'abord
# (décision du 28/10/2026, architecture §17.2).
title = "Firmin Moyen · Homelab"

# Thème PaperMod, installé en submodule dans themes/PaperMod.
theme = ["PaperMod"]

# Génère les brouillons dans `hugo server -D` mais pas dans un `hugo` classique.
buildDrafts = false

# Pages d'index des taxonomies (/<lang>/tags/, /<lang>/certifications/) non
# générées tant qu'aucune page n'utilise de tag ni de certification : elles
# seraient vides (décision du 28/10/2026). Les pages de terme restent générées.
# Retirer cette ligne le jour où le premier tag est utilisé.
disableKinds = ["taxonomy"]

# Français : servi sous /fr/.
# images : image OpenGraph par défaut (1200 × 630), une par langue (architecture §11.1).
[languages.fr]
  label = "Français"
  weight = 1
  locale = "fr-FR"
  [languages.fr.params]
    images = ["og-image.fr.png"]

# Anglais : servi sous /en/.
[languages.en]
  label = "English"
  weight = 2
  locale = "en-US"
  [languages.en.params]
    images = ["og-image.en.png"]

# Menus : déclarés dans le front matter des pages, pas ici
# (docs/structure.md §3.5). Une section en brouillon n'est pas construite,
# donc son entrée de menu n'apparaît qu'à sa publication.

# Taxonomies du site (docs/architecture.md §5.8).
[taxonomies]
  tag = "tags"
  certification = "certifications"

# Thème clair ou sombre selon le système du visiteur (bouton de bascule PaperMod toujours disponible).
# displayFullLangName : affiche "Français"/"English" (label de chaque langue)
# au lieu de "Fr"/"En" dans le toggle de langue de PaperMod.
# mainSections : section listée sur l'accueil par PaperMod.
[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  displayFullLangName = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  mainSections = ["journal"]
  # Auteur du site (balise meta author), adresse de contact unique (page À propos
  # de moi, CV, pied de page) et code source du site (pied de page).
  author = "Firmin Moyen"
  # L'auteur reste dans la balise meta, mais n'est pas répété sous chaque carte et chaque page.
  hideAuthor = true
  contactEmail = "contact@firminmoyen.dev"
  # Domaine public, affiché en clair (ligne « Site web » du CV) : fixe, pour que le serveur de dev
  # (qui remplace baseURL par localhost) ne l'affiche pas, ni dans un PDF imprimé depuis l'aperçu.
  siteDomain = "firminmoyen.dev"
  siteRepo = "https://github.com/FirminMoyen/portfolio"
  # Le pied de page de PaperMod est remplacé par celui du site, rendu dans
  # extend_footer.html (registre, architecture §11.7).
  hideFooter = true
  # Bandeau « site en construction » en haut de chaque page. Retiré le 25/10/2026 :
  # le contenu d'exemple est remplacé par les vraies données (architecture §9.2).
  underConstruction = false

# Monogramme FM à gauche du titre du site, dans l'en-tête.
[params.label]
  icon = "favicon.svg"
  iconHeight = 28

# Icônes d'onglet (monogramme FM, static/) et couleur de la barre du navigateur mobile.
[params.assets]
  favicon = "favicon.svg"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "safari-pinned-tab.svg"
  theme_color = "#2f5bea"

# Profil affiché sur l'accueil (architecture §5.1, §11.1). Valeurs fournies
# par Firmin ; un champ vide masque le bouton correspondant.
[params.profile]
  name = "Firmin Moyen"
  github = "https://github.com/FirminMoyen"
  linkedin = "https://www.linkedin.com/in/firmin-moyen-01724b264/"
  [params.profile.cv]
    fr = "/cv/cv-firmin-moyen-fr.pdf"
    en = "/cv/cv-firmin-moyen-en.pdf"

# Pagination des listes via PaperMod.
[pagination]
  pagerSize = 10

# Aucun service tiers (architecture P8) : les intégrations de Hugo sont coupées.
[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.x]
    disable = true
  [privacy.youTube]
    disable = true
