<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Page not found / Page introuvable</title>
<!-- Servie par GitHub Pages pour toute URL inconnue : Hugo ne génère la 404
     que sous /fr/ et /en/ (docs/structure.md P16). Page autonome, sans JS. -->
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f1f1f; --muted: #6c6c6c; --link: #1f1f1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1e20; --fg: #dadadb; --muted: #9b9c9d; --link: #dadadb; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 24px 16px; text-align: center; }
  h1 { font-size: 72px; margin: 0 0 16px; }
  p { margin: 8px 0; color: var(--muted); }
  a { color: var(--link); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Page not found. <a href="/en/">Back to the home page</a></p>
  <p lang="fr">Page introuvable. <a href="/fr/">Retour à l'accueil</a></p>
</main>
</body>
</html>
