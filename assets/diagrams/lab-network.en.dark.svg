<text x="988" y="554.5" text-anchor="middle" font-size="15" fill="#9da7b3">e.g. 10.42.10.0/24 → VLAN 10</text>
<text x="988" y="574.5" text-anchor="middle" font-size="15" fill="#9da7b3">monitoring, Windows, Linux, networking,</text>
<text x="988" y="594.5" text-anchor="middle" font-size="15" fill="#9da7b3">Kubernetes</text>
